<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario 2</title>
</head>
<body>
    <h1>formulario</h1>
    <form action="cadastro.php" autocomplete="on">
        <p>
            <label for="iusu">Usuario:</label>
            <input type="text" name="Usu" id="iusu" required minlength="5" maxlength="15" size="15" placeholder="nome de Usuario" autocomplete="username">
        </p>
        <p>
            <label for="isenha">Senha:</label>
            <input type="password" name="senha" id="isenha" required min="8" maxlength="15" size="15" placeholder="senha" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" name="Enviar" id="Enviar">
            <input type="reset">
        </p>
    </form>
</body>
</html>
