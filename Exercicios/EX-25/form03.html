<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 3</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <h1>teste de formulario</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iname">Nome:</label>
            <input type="text" name="name" id="iname" placeholder="Nome completo" maxlength="50" required>
        </p>
        <p>
            <label for="imedia">Media:</label>
            <input type="number" name="Media" id="imedia" min="0" max="10" step="0.1" required>
        </p>
        <p>
            <label for="imes">Mes:</label>
            <input type="month" name="Mes" id="imes" required value="2025-07">
        </p>
        <p>
            <label for="idata">Data:</label>
            <input type="date" name="Data" id="idata" required value="2025-07-31">
        </p>
        <p>
            <label for="ihora">Horario:</label>
            <input type="time" required>
        </p>
        <p>
            <input type="submit" name="Enviar">
            <input type="reset">
        </p>
    </form>
</body>
</html>
