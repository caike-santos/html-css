<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario7</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <h1>Formulario</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="iest">Estado:</label>
            <select name="est" id="iest">
                <option value="rj">Rio de Janeiro</option>
                <option value="mg">Minas Gerais</option>
                <option value="ba">Bahia</option>
            </select>
        </p>
        <p>
            <label for="iprof">Profição:</label>
            <input type="text" name="prof" id="iprof" list="prof">
            <datalist id="prof">
                <option >pedreiro</option>
                <option >manicure</option>
                <option >design</option>
            </datalist>
        </p>
        <p>
            <label for="imens">Mensagem:</label><br>
            <textarea name="mens" id="imens"></textarea>
        </p>
    </form>
</body>
</html>
