<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <style>
        #pai{
            display: flex;
            background-color: antiquewhite;
        }
        .filho{
            flex-basis: 200px;
            background-color: aquamarine;
            border: 2px solid black;
            text-align: center;
            
        }
        #f1{
            flex-shrink: 1;
            flex-grow: 1;
        }
        #f2{
            flex-shrink: 0;
            flex-grow: 1;
        }
        #f3{
            flex-shrink: 1;
            flex-grow: 1;
        }
    </style>
</head>
<body>
        <div id="pai">
            <div class="filho" id="f1">A</div>
            <div class="filho" id="f2">B</div>
            <div class="filho" id="f3">C</div>
        </div>
</body>
</html>
