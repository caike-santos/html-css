<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <style>
        #pai{
            display: flex;
            background-color: antiquewhite;
        }
        .filho{
            
            background-color: aquamarine;
            border: 2px solid black;
            text-align: center;
            
        }
        #f1{
            flex: 0 1 auto; 
            /* padrao */
            }
        #f2{
            flex: 0 0 100px;
            /* inflexivel */
            }
        #f3{
            flex: 1 1 auto;
            /* flexivel */
            }
    </style>
</head>
<body>
        <div id="pai">
            <div class="filho" id="f1">A</div>
            <div class="filho" id="f2">B</div>
            <div class="filho" id="f3">C</div>
        </div>
</body>
</html>
