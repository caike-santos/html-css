
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <style>
        #pai{
            display: flex;
            background-color: antiquewhite;
            flex-flow: row-reverse wrap;
        }
        .filho{
            flex: auto; 
            background-color: aquamarine;
            border: 2px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
        <div id="pai">
            <div class="filho">Exemplo de flexbox A</div>
            <div class="filho">Exemplo de flexbox B</div>
            <div class="filho">Exemplo de flexbox C</div>
            <div class="filho">Exemplo de flexbox D</div>    
            <div class="filho">Exemplo de flexbox E</div>
        </div>
</body>
</html>
