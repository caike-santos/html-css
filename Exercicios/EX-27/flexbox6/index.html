<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <style>
        #pai{
            display: flex;
            background-color: antiquewhite;
            flex-flow: row wrap;
            align-content: space-between;
            height: 550px;
        }
        .filho{
           
            background-color: aquamarine;
            border: 2px solid black;
            text-align: center;
            padding: 50px;
        }
    </style>
</head>
<body>
        <div id="pai">
            <div class="filho">A</div>
            <div class="filho">B</div>
            <div class="filho">C</div>
            <div class="filho">D</div>    
            <div class="filho">E</div>
            <div class="filho">F</div>
            <div class="filho">G</div>
            <div class="filho">H</div>
            <div class="filho">I</div>    
            <div class="filho">J</div>
        </div>
</body>
</html>
