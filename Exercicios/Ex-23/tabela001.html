<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <style>
        table{
            border-collapse: collapse;
            width: 400px;
            height: 200px;
        }
        td{
            border: 2px solid black;
            padding: 8px;
            text-align: center;
            /* vertical-align: bottom; */
        }
        .preta{
            background-color: rgba(0, 0, 0, 0.272);
        }
        .marcada{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <table>
        <tr class="preta">
            <td>A1</td>
            <td class="marcada">B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td class="marcada">C2</td>
        </tr>
        <tr class="preta">
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td class="marcada">A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
