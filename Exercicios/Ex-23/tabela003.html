<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem de tabelas</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <style>
        table{
            border-collapse: collapse;
            width: 300px;
            text-align: center;
            margin: auto;
        }
        td{
            border: 2px solid black;
            padding: 8px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td colspan="2">A</td>
            
            <td rowspan="3">C</td>
        </tr>
        <tr>
            <td rowspan="2">D</td>
            <td>E</td>
          
        </tr>
        <tr>
          
            
            <td>I</td>
        </tr>
        <tr>
            <td>J</td>
            <td colspan="2">K</td>
            
    </table>
</body>
</html>
